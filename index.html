<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic NLP Text Classification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .tab:hover { background: rgba(255,255,255,0.3); }
        .tab.active { background: white; color: #667eea; font-weight: bold; }
        .content-panel { display: none; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .content-panel.active { display: block; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .input-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }
        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .prediction-label {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .loading { display: none; text-align: center; padding: 20px; }
        .loading.active { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 نظام تصنيف النصوص العربية</h1>
            <p>منصة متقدمة للتعلم الآلي لتصنيف النصوص العربية</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('predict')">التنبؤ</button>
        </div>

        <div id="predict" class="content-panel active">
            <div class="input-group">
                <label>أدخل النص العربي للتصنيف:</label>
                <textarea id="inputText" rows="6" placeholder="اكتب أو الصق النص العربي هنا..."></textarea>
            </div>

            <button class="btn" onclick="predict()">🔍 تصنيف النص</button>
            <button class="btn" onclick="clearInput()">🗑️ مسح</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري معالجة النص...</p>
            </div>

            <div id="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let classNames = {};

        // Load class names on startup
        async function loadClassNames() {
            try {
                const response = await fetch(`${API_URL}/class-names`);
                if (response.ok) {
                    classNames = await response.json();
                    console.log('Class names loaded:', classNames);
                }
            } catch (error) {
                console.error('Error loading class names:', error);
                classNames = {'0': 'فئة 0', '1': 'فئة 1', '2': 'فئة 2'};
            }
        }

        function showTab(tabName) {
            // For now, only one tab
        }

        async function predict() {
            const text = document.getElementById('inputText').value.trim();
            
            if (!text) {
                showError('الرجاء إدخال نص للتصنيف');
                return;
            }

            document.getElementById('loading').classList.add('active');
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text})
                });

                document.getElementById('loading').classList.remove('active');

                if (!response.ok) {
                    throw new Error('فشل الاتصال بالخادم');
                }

                const data = await response.json();

                if (data.success) {
                    displayResult(text, data.predicted_class, data.confidence, data.processing_time);
                } else {
                    showError(data.error || 'حدث خطأ في التصنيف');
                }

            } catch (error) {
                console.error('Prediction error:', error);
                document.getElementById('loading').classList.remove('active');
                showError('فشل الاتصال بالخادم. تأكد من تشغيل Backend.');
            }
        }

        function displayResult(text, predictedClass, confidence, time) {
            const className = classNames[predictedClass] || classNames[String(predictedClass)] || `فئة ${predictedClass}`;
            const confidencePercent = (confidence * 100).toFixed(1);

            const resultHTML = `
                <div class="result-box">
                    <h3>✅ نتيجة التصنيف</h3>
                    <div style="margin: 15px 0;">
                        <div class="prediction-label">${className}</div>
                    </div>
                    <p><strong>مستوى الثقة:</strong> ${confidencePercent}%</p>
                    <p><strong>النص:</strong> ${text.substring(0, 100)}${text.length > 100 ? '...' : ''}</p>
                    <p style="color: #888; font-size: 14px; margin-top: 10px;">
                        ⏱️ وقت المعالجة: ${time}ms
                    </p>
                </div>
            `;

            document.getElementById('result').innerHTML = resultHTML;
            document.getElementById('result').style.display = 'block';
        }

        function showError(message) {
            const errorHTML = `
                <div class="error-message">
                    ⚠️ ${message}
                </div>
            `;
            document.getElementById('result').innerHTML = errorHTML;
            document.getElementById('result').style.display = 'block';
        }

        function clearInput() {
            document.getElementById('inputText').value = '';
            document.getElementById('result').style.display = 'none';
        }

        // Load class names on page load
        window.onload = function() {
            loadClassNames();
        };
    </script>
</body>
</html>
