

# Model selection (THIS is the key)
model_type: "LSTM"
# Possible values:
# - Simple_FeedForwardNN
# - LSTM
# - GRU
# - CNN

# Save model
model_save_path: "results/models/best_model.pkl"
checkpoint_dir: "results/models/model_checkpoints/"

# Data paths
data:
  processed_dir: "data/processed"
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"
  validation_size: 0.15

# Model hyperparameters
model:
  input_dim: 1000        # auto-updated
  hidden_dim: 128
  num_classes: 6
  dropout: 0.3
  lr: 0.001
  num_epochs: 5
  batch_size: 64
 # Sequence models (Embeddings)
  embedding_dim: 50
  num_layers: 1
  bidirectional: true